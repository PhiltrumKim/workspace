<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHOST 시나리오 편집기</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>GHOST</b> 시나리오 편집기</div>
  <div class="conn" id="conn">연결 중…</div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">대기</span></div>
</header>

<main class="layout">
  <!-- 장비 화면 -->
  <section class="screen-pane">
    <div class="toolbar">
      <div class="seg" role="radiogroup" aria-label="화면">
        <button id="btn-live" class="on" title="장비 화면을 계속 갱신">실시간</button>
        <button id="btn-snap" title="지금 화면을 고정해 그 위에서 대상을 지정">화면 고정</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="마우스 동작">
        <button data-mode="view" class="on">보기</button>
        <button data-mode="select" title="드래그해서 버튼·글자 영역을 대상으로 등록">대상 지정</button>
        <button data-mode="control" title="클릭하면 장비에 실제 클릭이 들어갑니다">직접 조작</button>
      </div>
      <span class="hint" id="mode-hint">화면을 보기만 합니다.</span>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="screen" tabindex="0" aria-label="장비 화면"></canvas>
      <div class="pick-banner" id="pick-banner" hidden></div>
    </div>
    <div class="control-bar" id="control-bar" hidden>
      <label>글자 <input id="ctl-text" placeholder="입력할 글자 (영문)"></label>
      <button id="ctl-type">입력</button>
      <label>키 <input id="ctl-key" list="key-list" placeholder="enter, esc, ctrl+s…" size="12"></label>
      <button id="ctl-key-btn">보내기</button>
      <button id="ctl-home" title="커서를 좌상단으로 보내 위치를 다시 잡습니다">커서 원점</button>
      <span class="hint">좌클릭 = 클릭 · 우클릭 = 우클릭 · Shift+클릭 = 더블클릭</span>
    </div>
  </section>

  <!-- 오른쪽 패널 -->
  <section class="side-pane">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="scenario" class="on">시나리오</button>
      <button role="tab" data-tab="targets">대상</button>
      <button role="tab" data-tab="runs">실행 기록</button>
    </nav>

    <!-- 시나리오 탭 -->
    <div class="tab" id="tab-scenario">
      <div class="row">
        <select id="scen-select" aria-label="시나리오 선택"></select>
        <button id="scen-new">새로 만들기</button>
      </div>
      <div class="field-grid">
        <label>이름 <input id="scen-name" placeholder="영문_숫자 (예: run_recipe)"></label>
        <label>설명 <input id="scen-desc" placeholder="무엇을 하는 시나리오인지"></label>
      </div>
      <div class="row wrap">
        <button id="scen-save" class="primary">저장</button>
        <button id="scen-validate">검증</button>
        <button id="scen-run" class="go">▶ 전체 실행</button>
        <button id="scen-stop" class="danger" disabled>■ 중지</button>
        <button id="scen-json-toggle" class="ghost">JSON</button>
      </div>
      <div class="msg" id="scen-msg" hidden></div>
      <textarea id="scen-json" class="json" hidden spellcheck="false"></textarea>
      <ol class="steps" id="steps"></ol>
      <button id="step-add" class="add">+ 스텝 추가</button>
      <form class="card step-form" id="step-form" hidden>
        <div class="form-head"><b id="step-form-title">스텝 추가</b><button type="button" class="ghost" id="step-cancel">닫기</button></div>
        <label>동작 <select id="sf-action"></select></label>
        <div id="sf-fields"></div>
        <details id="sf-adv"><summary>JSON으로 편집</summary><textarea id="sf-json" class="json small" spellcheck="false"></textarea></details>
        <div class="row wrap">
          <button type="submit" class="primary" id="sf-save">추가</button>
          <button type="button" id="sf-try" class="go">▶ 이 스텝 실행</button>
        </div>
        <div class="msg" id="sf-msg" hidden></div>
      </form>
    </div>

    <!-- 대상 탭 -->
    <div class="tab" id="tab-targets" hidden>
      <p class="hint">화면에서 <b>대상 지정</b>을 누르고 버튼이나 글자 영역을 드래그하면 여기서 등록합니다.</p>
      <form class="card" id="target-form" hidden>
        <div class="form-head"><b>대상 등록</b><button type="button" class="ghost" id="tf-cancel">닫기</button></div>
        <div class="tf-preview"><canvas id="tf-canvas"></canvas><span class="mono" id="tf-box"></span></div>
        <div class="seg" role="radiogroup">
          <button type="button" data-kind="template" class="on">그림으로 찾기</button>
          <button type="button" data-kind="text">글자로 찾기 (OCR)</button>
        </div>
        <p class="hint" id="tf-kind-hint"></p>
        <label>이름 <input id="tf-name" placeholder="영문_숫자 (예: start_btn)" required></label>
        <div id="tf-text-fields" hidden>
          <label>찾을 글자 <input id="tf-text"></label>
          <div class="chips" id="tf-ocr"></div>
          <label>비교 방식
            <select id="tf-match">
              <option value="contains">포함</option><option value="exact">완전 일치 (메뉴 항목 권장)</option>
              <option value="fuzzy">비슷하면 일치</option><option value="regex">정규식</option>
            </select></label>
        </div>
        <div id="tf-tmpl-fields" class="field-grid">
          <label>일치 기준 <input id="tf-threshold" type="number" step="0.01" min="0.5" max="1" placeholder="0.8"></label>
          <label>색 검증 <input id="tf-color" type="number" step="1" min="0" placeholder="색으로 상태 구분 시 25"></label>
        </div>
        <div class="row"><button type="submit" class="primary">등록</button><button type="button" id="tf-test">찾기 테스트</button></div>
        <div class="msg" id="tf-msg" hidden></div>
      </form>
      <input id="target-filter" placeholder="이름으로 찾기" aria-label="대상 검색">
      <ul class="targets" id="targets"></ul>
    </div>

    <!-- 실행 기록 탭 -->
    <div class="tab" id="tab-runs" hidden>
      <div class="row"><button id="runs-refresh">새로고침</button></div>
      <ul class="runs" id="runs"></ul>
      <div id="run-detail"></div>
    </div>
  </section>
</main>

<section class="logs" id="logs-pane">
  <div class="logs-head"><b>로그</b><button class="ghost" id="logs-clear">지우기</button></div>
  <pre id="logs"></pre>
</section>

<datalist id="key-list"></datalist>
<script src="/static/app.js"></script>
</body>
</html>
